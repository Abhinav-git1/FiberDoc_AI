# Alembic: versioned database migrations. Run from backend/:
#   alembic upgrade head        apply every migration not yet applied
#   alembic downgrade -1        undo the last one
#   alembic revision --autogenerate -m "add x"   draft a migration from changes in app/db/models.py
#   alembic current / history   where this database is / list of migrations
# The database URL comes from DATABASE_URL (backend/.env), not from this file.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
